<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa del viaggio · Helsinki, Tallinn, Vilnius</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fbfaf7;--fg:#16283a;--mut:#5d6b7a;--bd:#cfd6dd;--d1:#1d4e89;--d2:#d9730d;--rt:#c2255c}
@media (prefers-color-scheme:dark){:root{--bg:#14212e;--fg:#e9eef3;--mut:#9fb0c0;--bd:#34475a}}
html,body{height:100%;margin:0;font:14px/1.45 Georgia,"Times New Roman",serif;color:var(--fg)}
#map{position:absolute;inset:0}
#bar{position:absolute;z-index:1000;top:10px;left:56px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--fg)}
button:focus-visible,textarea:focus-visible{outline:3px solid #ffd43b;outline-offset:1px}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#info{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;color:var(--mut)}
[hidden]{display:none!important}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:700 11px/22px system-ui,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0007;background:var(--d1)}
.pin.sel{outline:3px solid #ffd43b}
#lb{position:fixed;inset:0;z-index:2000;background:#000f;display:none;flex-direction:column}
#lb.show{display:flex}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#im{max-width:100%;max-height:100%;object-fit:contain}
#er{position:absolute;color:#fff;text-align:center;padding:20px}
.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:30px;line-height:1;background:#0009;color:#fff;border-color:#fff4;padding:10px 14px}
#x{position:absolute;top:10px;right:10px;background:#0009;color:#fff;border-color:#fff4}
.cap{background:#111;color:#f2f2f2;padding:12px 16px 16px;max-height:34vh;overflow:auto}
#meta{color:#b8c2cc;font-size:12px;margin-bottom:4px}
#ct{font-size:17px;max-width:70ch}
#ta{width:100%;box-sizing:border-box;min-height:64px;font:inherit;font-size:16px;background:#1d1d1d;color:#fff;border:1px solid #555;border-radius:6px;padding:8px}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
 <button id="bEu">Tutto il viaggio</button>
 <button id="bRt" class="on">Percorso</button>
 <button id="bMd">Percorso personalizzato</button>
 <button id="bUn" hidden>Annulla ultima tappa</button>
 <button id="bCl" hidden>Azzera</button>
 <button id="bEd">Modifica didascalie</button>
 <button id="bEx" hidden>Esporta didascalie</button>
 <button id="bIm" hidden>Importa didascalie</button>
 <input id="fi" type="file" accept=".json,application/json" hidden>
 <span id="info"></span>
</div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Foto a schermo intero">
 <div class="stage">
  <button class="nav" id="pv" style="left:8px" aria-label="Foto precedente">‹</button>
  <img id="im" alt="">
  <div id="er" hidden></div>
  <button class="nav" id="nx" style="right:8px" aria-label="Foto successiva">›</button>
  <button id="x" aria-label="Chiudi">Chiudi ✕</button>
 </div>
 <div class="cap"><div id="meta"></div><div id="ct"></div><textarea id="ta" aria-label="Didascalia" placeholder="Scriva qui la didascalia"></textarea></div>
</div>

60822_154915810.MP.jpg","2026-08-22T18:49:15",59.436572,24.746028],[1,"PXL_20260822_172342464.jpg","2026-08-22T20:23:42",59.436639,24.7496],[2,"PXL_20260823_061116172.jpg","2026-08-23T09:11:16",54.642986,25.279383],[2,"PXL_20260823_072600333.jpg","2026-08-23T10:26:00",54.67895,25.287542],[2,"PXL_20260823_080721178.jpg","2026-08-23T11:07:21",54.691167,25.274703],[2,"PXL_20260823_081943353.jpg","2026-08-23T11:19:43",54.694281,25.276039],[2,"PXL_20260823_082208404.jpg","2026-08-23T11:22:08",54.694611,25.276844],[2,"PXL_20260823_095057067.jpg","2026-08-23T12:50:57",54.686756,25.297467],[2,"PXL_20260823_100416715.jpg","2026-08-23T13:04:16",54.687283,25.289708],[2,"PXL_20260823_110008537~2.jpg","2026-08-23T14:00:08",54.683353,25.289403],[2,"PXL_20260823_111234746.jpg","2026-08-23T14:12:34",54.683361,25.289397],[2,"PXL_20260823_140954113.jpg","2026-08-23T17:09:54",54.685125,25.288853],[2,"PXL_20260823_141256716.jpg","2026-08-23T17:12:56",54.685736,25.289803],[2,"PXL_20260823_143446023.jpg","2026-08-23T17:34:46",54.687072,25.291572],[2,"PXL_20260823_144001805.jpg","2026-08-23T17:40:01",54.686606,25.291492],[2,"PXL_20260823_150722218.jpg","2026-08-23T18:07:22",54.683406,25.292806],[2,"PXL_20260823_153114290.MP.jpg","2026-08-23T18:31:14",54.680147,25.295519],[2,"PXL_20260823_161321751.jpg","2026-08-23T19:13:21",54.679819,25.2862],[2,"PXL_20260823_170840625.jpg","2026-08-23T20:08:40",54.686003,25.285886],[2,"PXL_20260823_171010267.MP.jpg","2026-08-23T20:10:10",54.686286,25.285075],[2,"PXL_20260823_172018376.jpg","2026-08-23T20:20:18",54.687186,25.280292],[2,"PXL_20260824_072953059.jpg","2026-08-24T10:29:53",54.681178,25.293458],[2,"PXL_20260824_075042350.jpg","2026-08-24T10:50:42",54.680869,25.306117],[2,"PXL_20260824_090657523.jpg","2026-08-24T12:06:57",54.678597,25.303175],[2,"PXL_20260824_094830844.jpg","2026-08-24T12:48:30",54.676897,25.299497],[2,"PXL_20260824_103052778.jpg","2026-08-24T13:30:52",54.678467,25.297469]];
const $=id=>document.getElementById(id);
const fmt=t=>new Date(t).toLocaleString('it-IT',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const defCap=p=>C[p[0]].n+', '+fmt(p[2]);
let saved={},remote={},edit=false,mode='chrono',showRoute=true,custom=[],cur=0;
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
const cap=i=>saved[P[i][1]]??remote[P[i][1]]??defCap(P[i]);
fetch('captions.json').then(r=>r.ok?r.json():{}).then(j=>{remote=j;if($('lb').classList.contains('show'))openPhoto(cur)}).catch(()=>{});

const map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const all=P.map(p=>[p[3],p[4]]);
const view=b=>map.fitBounds(b,{padding:[50,50]});
view(all);

const M=P.map((p,i)=>{
 const m=L.marker(all[i],{keyboard:true,title:'Foto '+(i+1),icon:L.divIcon({className:'',html:'<div class="pin" style="background:'+C[p[0]].c+'">'+(i+1)+'</div>',iconSize:[26,26]})}).addTo(map);
 m.bindTooltip(()=>'Foto '+(i+1)+' · '+C[p[0]].n+' · '+fmt(p[2]),{direction:'top',offset:[0,-12]});
 m.on('click',()=>{mode==='custom'?(custom.push(i),draw()):openPhoto(i)});
 return m;
});

const lines=L.layerGroup().addTo(map);
const km=(a,b)=>{const r=Math.PI/180,x=Math.sin((b[0]-a[0])*r/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin((b[1]-a[1])*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
function draw(){
 lines.clearLayers();
 const r=mode==='chrono'?P.map((_,i)=>i):custom;let t=0;
 for(let k=1;k<r.length;k++){
  const a=all[r[k-1]],b=all[r[k]],d=km(a,b);t+=d;
  if(showRoute)L.polyline([a,b],{color:'#c2255c',weight:4,opacity:.85,dashArray:d>50?'8 8':null}).addTo(lines);
 }
 $('info').textContent=mode==='custom'&&!r.length?'Faccia clic sui segnalini nell\u2019ordine desiderato':'Percorso: '+r.length+' tappe, '+Math.round(t).toLocaleString('it-IT')+' km in linea retta';
}

function openPhoto(i){
 cur=(i+P.length)%P.length;const p=P[cur];
 $('im').src=C[p[0]].d+encodeURIComponent(p[1]);$('im').alt=cap(cur);$('er').hidden=true;
 $('meta').textContent='Foto '+(cur+1)+' di '+P.length+' · '+C[p[0]].n+', '+fmt(p[2]);
 $('ct').textContent=cap(cur);$('ta').value=cap(cur);
 $('ct').hidden=edit;$('ta').hidden=!edit;
 $('lb').classList.add('show');
 M.forEach((m,k)=>{const e=m.getElement();e&&e.firstChild.classList.toggle('sel',k===cur)});
}
$('im').onerror=()=>{$('er').hidden=false;$('er').textContent='Foto non trovata: '+C[P[cur][0]].d+P[cur][1]};
$('im').onload=()=>{$('er').hidden=true};
const closeLb=()=>{$('lb').classList.remove('show');$('im').removeAttribute('src');map.panTo(all[cur])};
$('x').onclick=closeLb;$('pv').onclick=()=>openPhoto(cur-1);$('nx').onclick=()=>openPhoto(cur+1);
$('ta').oninput=e=>{saved[P[cur][1]]=e.target.value;store()};
document.addEventListener('keydown',e=>{
 if(!$('lb').classList.contains('show'))return;
 if(e.key==='Escape')closeLb();
 if(e.target.tagName==='TEXTAREA')return;
 if(e.key==='ArrowLeft')openPhoto(cur-1);
 if(e.key==='ArrowRight')openPhoto(cur+1);
});

$('bEu').onclick=()=>view(all);
C.forEach((c,k)=>{const b=document.createElement('button');b.textContent=c.n;b.style.borderLeft='6px solid '+c.c;b.onclick=()=>view(P.filter(p=>p[0]===k).map(p=>[p[3],p[4]]));$('bar').insertBefore(b,$('bRt'))});
$('bRt').onclick=e=>{showRoute=!showRoute;e.target.classList.toggle('on',showRoute);draw()};
$('bMd').onclick=e=>{
 mode=mode==='chrono'?'custom':'chrono';
 e.target.classList.toggle('on',mode==='custom');
 $('bUn').hidden=$('bCl').hidden=mode!=='custom';
 draw();
};
$('bUn').onclick=()=>{custom.pop();draw()};
$('bCl').onclick=()=>{custom=[];draw()};
$('bEd').onclick=e=>{
 edit=!edit;e.target.classList.toggle('on',edit);
 $('bEx').hidden=$('bIm').hidden=!edit;
};
$('bEx').onclick=()=>{
 const o={};P.forEach((p,i)=>o[p[1]]=cap(i));
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
 a.download='captions.json';a.click();
};
$('bIm').onclick=()=>$('fi').click();
$('fi').onchange=async()=>{
 try{Object.assign(saved,JSON.parse(await $('fi').files[0].text()));store();$('info').textContent='Didascalie importate'}
 catch(e){$('info').textContent='File non valido'}
 $('fi').value='';
};
draw();
</script>
</body>
</html>
